name: glasgow-deploy
# Glasgow Loop (Phase 2 skeleton). MANUAL ONLY on purpose: the site is noindex and has no data sources yet, and the
# Cloudflare project, custom domain and secrets (`wrangler secret put <NAME> --env glasgow`) are owner steps that
# do not exist until the owner has done them. Add the `push` trigger (copy broomfield-deploy.yml) when the site is
# meant to deploy on every push. No cache purge / content-freshness step yet: there is no zone secret for the
# domain and nothing scrapes for this town.
# Actions minutes (private repo, 2026-10-28; .claude/specs/actions-minutes-plan.md): deploys only when a file that reaches THIS town changed
# (paths filter; shared site code = every town), and a newer push cancels an older, still-running deploy of the same town.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'configs/glasgow.json'
      - 'scripts/wrangler_deploy_retry.sh'
      - 'scripts/purge_cloudflare_cache.py'
      - 'scripts/check_deployed_content.py'
      - '.github/workflows/glasgow-deploy.yml'
      # not part of any build:
      - '!site/**/*.test.ts'
      - '!site/**/*.md'
  workflow_dispatch: {}

concurrency:
  group: deploy-push-glasgow
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Glasgow)
        working-directory: site
        env:
          SITE_CITY: glasgow
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # What's On (Ticketmaster GB, 15 mi) is fetched at build time; without the key the page would be empty (the Moreno 2026-09 bug).
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: bash ../scripts/build_retry.sh
      - name: Verify no empty messages or explanation boxes (Glasgow)
        run: node scripts/verify_no_empty_messages.mjs site/dist
      - name: Deploy to Cloudflare Workers (Glasgow)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ../scripts/wrangler_deploy_retry.sh --env glasgow

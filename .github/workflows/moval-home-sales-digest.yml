name: moval-home-sales-digest
# Kör home_sales_digest.py, som i sig itererar över VARJE kalendermånad som har
# data i property_sales (inte bara "förra månaden") -- se moduldocstringen i
# ai_pipeline/home_sales_digest.py för varför. Körs månadsvis, men eftersom
# property_sales bara fylls på manuellt/kvartalsvis (rivcoacr.org blockerar
# AI-agenter) gör de flesta körningarna ingenting: content_hash-kollen i
# skriptet skippar redan oförändrade månader utan AI-anrop.
#
# Kör gärna manuellt (workflow_dispatch) direkt efter att en ny kvartalsfil
# har laddats ner och körts genom rivco_property_sales_v1.py, i stället för
# att vänta på nästa schemalagda körning.

on:
  schedule:
    - cron: "0 15 1 * *"   # första i varje månad, 15:00 UTC (08:00 PDT)
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:        "morenovalleyview.com (contact: hello@morenovalleyview.com)"
      AI_BUDGET_STATE:   ".ai_budget_moreno_valley_ca.json"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generera/uppdatera home sales-digestar
        run: python -m ai_pipeline.home_sales_digest --config configs/moreno_valley_ca.json
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK_MOVAL curl step
      # (2026-09-09) -- see scrape.yml's own comment and
      # NEEDS-HUMAN-REVIEW.md #38. The hook built independently inside
      # Cloudflare from its own env vars and could race/overwrite a correct
      # wrangler deploy landing around the same time -- wrangler deploy is
      # now the only deploy path.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Moreno Valley)
        working-directory: site
        env:
          SITE_CITY: moreno_valley_ca
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Moreno Valley)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env moreno_valley

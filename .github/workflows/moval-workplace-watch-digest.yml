name: moval-workplace-watch-digest
# Kör scripts.seed_employers (säkert att köra om -- upsertar på (town_id, slug))
# följt av ai_pipeline.workplace_watch_digest, som söker (Brave Search --
# Glassdoor/Indeed har ingen publik API och blockerar skrapning) och skriver
# månadens Worker Pulse-digest per arbetsgivare. Månatlig cadence: review-
# volym ändras inte snabbt nog för att motivera oftare körningar, och håller
# Brave-kvoten trivial (5 arbetsgivare x 2 sökningar = 10 anrop/månad).

on:
  schedule:
    - cron: "0 15 1 * *"   # 1:a varje månad, 15:00 UTC (08:00 PDT)
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRAVE_API_KEY:     ${{ secrets.BRAVE_API_KEY }}
      USER_AGENT:        "morenovalleyview.com (contact: hello@morenovalleyview.com)"
      AI_BUDGET_STATE:   ".ai_budget_moreno_valley_ca.json"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Uppdatera arbetsgivarlistan
        run: python -m scripts.seed_employers moreno_valley_ca
      - name: Generera månadens Worker Pulse-digest
        run: python -m ai_pipeline.workplace_watch_digest --config configs/moreno_valley_ca.json
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK_MOVAL curl step
      # (2026-09-09) -- see scrape.yml's own comment and
      # NEEDS-HUMAN-REVIEW.md #38. The hook built independently inside
      # Cloudflare from its own env vars and could race/overwrite a correct
      # wrangler deploy landing around the same time -- wrangler deploy is
      # now the only deploy path.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Moreno Valley)
        working-directory: site
        env:
          SITE_CITY: moreno_valley_ca
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Moreno Valley)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env moreno_valley

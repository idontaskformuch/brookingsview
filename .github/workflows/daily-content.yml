name: daily-content
# Innehållsspår v1, Steg 4. Körs en gång/dag: dagens typ ur weekly_rotation,
# underlag ur redan skrapad och guardrail-godkänd data, genererar via rätt
# content/kronikor-modul, skriver till stories vid pass. Steg 3.5: en matchande
# illustration genereras samtidigt och sparas i site/public/assets/images/.
#
# Alla sex innehållstyper är kopplade in (se ai_pipeline/daily_content.py MODULES).
#
# Illustrationen är en fil, inte en DB-rad -- Cloudflare Pages bygger från git,
# så bilden måste committas tillbaka till repot innan rebuild-hooken triggas,
# annars finns den bara på Actions-körarens efemära filsystem och försvinner.

on:
  schedule:
    - cron: "0 12 * * *"   # varje morgon, 12:00 UTC (07:00 CDT)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-content:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FAL_KEY:           ${{ secrets.FAL_KEY }}
      USER_AGENT:        "brookingsview.com (contact: hello@brookingsview.com)"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generera dagens innehåll + illustration
        run: python -m ai_pipeline.daily_content --config configs/brookings_sd.json
      - name: Committa genererad illustration
        run: |
          git config user.name "brookingsview-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/assets/images
          if git diff --cached --quiet; then
            echo "ingen ny illustration -- inget att committa"
          else
            git commit -m "Daily content: add illustration for today's article"
            git pull --rebase origin main && git push
          fi
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK curl step (2026-09-09) --
      # see scrape.yml's own comment and NEEDS-HUMAN-REVIEW.md #38. The hook
      # built independently inside Cloudflare from its own env vars and
      # could race/overwrite a correct wrangler deploy landing around the
      # same time -- wrangler deploy is now the only deploy path. Builds
      # from THIS job's own local checkout, which already has the
      # illustration committed above (git add/commit operate on local disk
      # before the push) -- no extra checkout/pull needed.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Brookings)
        working-directory: site
        env:
          SITE_CITY: brookings_sd
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Brookings)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env brookings

name: weekly-roundup
# Veckosammanfattningen. Körs måndag morgon lokal tid (11:00 UTC = 06:00 CDT),
# när veckans agendor och evenemang hunnit publiceras av källorna men veckan
# fortfarande ligger framför läsaren.
#
# Körs även varje kväll: underlaget hashas i weekly.py, så en körning där inget
# tillkommit gör INGET AI-anrop alls. Läggs ett nytt biblioteksevenemang till på
# onsdagen skrivs artikeln om -- annars vore den inaktuell resten av veckan.

on:
  schedule:
    - cron: "0 11 * * 1"    # måndag morgon -- första versionen
    - cron: "0 23 * * *"    # varje kväll -- skriver bara om vid ändrat underlag
  workflow_dispatch: {}

jobs:
  roundup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      USER_AGENT:        "ViewMediaBot (+https://brookingsview.com/contact)"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      - name: Fingerprint before
        run: python -m scripts.ci_changed before brookings_sd --preset content
      - name: Generera veckosammanfattning
        run: python -m ai_pipeline.weekly --config configs/brookings_sd.json
      - name: Did the site content change?
        id: changed
        run: python -m scripts.ci_changed after brookings_sd --preset content
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK curl step (2026-09-09) --
      # see scrape.yml's own comment and NEEDS-HUMAN-REVIEW.md #38. The hook
      # built independently inside Cloudflare from its own env vars and
      # could race/overwrite a correct wrangler deploy landing around the
      # same time -- wrangler deploy is now the only deploy path.
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
      - name: Install site deps
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        run: npm ci
      - name: Build (Brookings)
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        env:
          SITE_CITY: brookings_sd
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Brookings)
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ../scripts/wrangler_deploy_retry.sh --env brookings

name: tests
# Kör pytest-svit vid varje push/PR -- se tests/. Innehåller bl.a. den
# obligatoriska ort-kontamineringsspärren (tests/test_town_guard.py,
# tests/test_content_prompts.py), tillagd efter juli-augusti 2026-incidenten
# där Brookings-identitet läckte in i Moreno Valley-publicerat innehåll (se
# ai_pipeline/town_guard.py). Kräver ingen DATABASE_URL/ANTHROPIC_API_KEY --
# alla tester kör mot fixtur-data, ingen nätverks-/DB-åtkomst.

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v

  # Type-checks site/src -- catches the class of regression this was added
  # for (Event JSON-LD venue resolution, see NEEDS-HUMAN-REVIEW.md): a wrong
  # prop shape or a missing DB column reference fails here instead of
  # silently shipping. Pure static analysis, same as `astro check` run
  # locally -- no DATABASE_URL needed, sql`` template calls are never
  # executed during type-checking.
  astro-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run check

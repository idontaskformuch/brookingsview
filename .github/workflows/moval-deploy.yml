name: moval-deploy
# Moreno Valley equivalent of deploy.yml -- see that file's own comment for
# the full reasoning (closing the third recurrence of the "two paths into
# production" architecture bug by replacing Cloudflare Workers Builds' own
# git integration with a second TRIGGER for the same single deploy
# mechanism, rather than leaving wrangler deploy reachable only from the
# 6-hour scrape cron).
# Actions minutes (private repo, 2026-10-28; .claude/specs/actions-minutes-plan.md): deploys only when a file that reaches THIS town changed
# (paths filter; shared site code = every town), and a newer push cancels an older, still-running deploy of the same town.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'configs/moreno_valley_ca.json'
      - 'scripts/wrangler_deploy_retry.sh'
      - 'scripts/purge_cloudflare_cache.py'
      - 'scripts/check_deployed_content.py'
      - '.github/workflows/moval-deploy.yml'
      # not part of any build:
      - '!site/**/*.test.ts'
      - '!site/**/*.md'
      # Glasgow-only files do not rebuild the US towns:
      - '!site/src/config/gb/**'
      - '!site/src/components/legal/gb/**'
      - '!site/public/assets/images/**/glasgow-*'
  workflow_dispatch: {}

concurrency:
  group: deploy-push-moreno_valley_ca
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Moreno Valley)
        working-directory: site
        env:
          SITE_CITY: moreno_valley_ca
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Verify no empty messages or explanation boxes (Moreno Valley)
        run: node scripts/verify_no_empty_messages.mjs site/dist
      - name: Deploy to Cloudflare Workers (Moreno Valley)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ../scripts/wrangler_deploy_retry.sh --env moreno_valley
      # See deploy.yml's own identical step for the full 2026-10-15
      # incident writeup (.claude/state.md) -- continue-on-error so a
      # purge failure is visible but never blocks the deploy-content
      # check below, which the deploy (already done by this point) can't
      # be rolled back by failing anyway.
      - name: Purge Cloudflare cache
        if: success()
        continue-on-error: true
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID_MORENO_VALLEY }}
        run: python -m scripts.purge_cloudflare_cache --town moreno_valley_ca
      - name: Kontrollera att den deployade sajten faktiskt har färskt innehåll
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_CHECK_SECRET: ${{ secrets.DEPLOY_CHECK_SECRET }}
        run: |
          sleep 10
          python -m scripts.check_deployed_content --config configs/moreno_valley_ca.json

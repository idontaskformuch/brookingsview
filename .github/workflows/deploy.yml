name: deploy
# Builds and deploys Brookings on every push to main -- the ONLY thing this
# workflow does, deliberately split out from scrape-and-publish.yml's own
# 6-hour cron.
#
# Why this exists: disabling Cloudflare Workers Builds' own git integration
# (see the comment on scrape.yml's Deploy step) closes the THIRD recurrence
# of the same architecture bug -- two independent paths into production,
# each capable of shipping a build the other one wouldn't have (first the
# Cloudflare Pages deploy hook, then a split-traffic incident traced to that
# same hook, now Workers Builds deploying with its own incomplete secret
# set). But wrangler deploy living ONLY inside the 6-hour scrape cron has a
# real cost: a pure code push (no new scraped data at all) wouldn't reach
# production for up to 6 hours. This workflow is that fix -- a second
# TRIGGER for the exact same, single deploy mechanism (build with the full
# GitHub Actions secret set, then wrangler deploy), not a second mechanism.
# scrape.yml's own cron-triggered run still does the real job of scraping +
# republishing; this one exists purely so a code-only change goes live
# within minutes instead of waiting for that cron.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Brookings)
        working-directory: site
        env:
          SITE_CITY: brookings_sd
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Brookings)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env brookings
      # Same check scrape.yml's own identical step runs -- cheap, and a
      # push-triggered deploy deserves the same "did it actually work"
      # verification a scrape-triggered one gets, not a lesser one just
      # because it's the fast path.
      - name: Kontrollera att den deployade sajten faktiskt har färskt innehåll
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_CHECK_SECRET: ${{ secrets.DEPLOY_CHECK_SECRET }}
        run: |
          sleep 10
          python -m scripts.check_deployed_content --config configs/brookings_sd.json

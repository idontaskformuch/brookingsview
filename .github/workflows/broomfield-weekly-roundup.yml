name: broomfield-weekly-roundup
# Broomfield-motsvarigheten till weekly-roundup.yml/moval-weekly-roundup.yml.
# Samma hashning i weekly.py gör att en körning utan nya agendor/evenemang
# inte gör något AI-anrop alls -- se kommentaren i originalfilen.

on:
  schedule:
    - cron: "0 12 * * 1"    # måndag morgon Mountain -- första versionen
    - cron: "0 23 * * *"    # varje kväll -- skriver bara om vid ändrat underlag
  workflow_dispatch: {}

jobs:
  roundup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:        "broomfieldview.com (contact: hello@broomfieldview.com)"
      AI_BUDGET_STATE:   ".ai_budget_broomfield_co.json"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generera veckosammanfattning
        run: python -m ai_pipeline.weekly --config configs/broomfield_co.json
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK_BROOMFIELD curl step
      # (2026-09-09) -- see scrape.yml's own comment and
      # NEEDS-HUMAN-REVIEW.md #38. The hook built independently inside
      # Cloudflare from its own env vars and could race/overwrite a correct
      # wrangler deploy landing around the same time -- wrangler deploy is
      # now the only deploy path.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Broomfield)
        working-directory: site
        env:
          SITE_CITY: broomfield_co
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Broomfield)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env broomfield

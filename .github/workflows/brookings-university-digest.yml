name: brookings-university-digest
# Kör sdsu_weekly_digest.py, som sammanfattar INNEVARANDE måndag-söndag-vecka
# i sdsu_events (SDSU:s publika event-kalender, se
# scrapers/parsers/sdsu_events_v1.py). Till skillnad från
# moval-sports-digest.yml (som täcker en REDAN SPELAD vecka) är det här
# framåtblickande -- körs måndag morgon så veckans events redan är kända.
# content_hash-kollen i skriptet skippar AI-anropet om samma vecka körs om
# utan att underlaget ändrats.

on:
  schedule:
    - cron: "0 13 * * 1"   # måndag 13:00 UTC (08:00 Central)
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:        "brookingsview.com (contact: hello@brookingsview.com)"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generera veckans SDSU-sammanfattning
        run: python -m ai_pipeline.sdsu_weekly_digest --config configs/brookings_sd.json
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK curl step (2026-09-09) --
      # see scrape.yml's own comment and NEEDS-HUMAN-REVIEW.md #38. The hook
      # built independently inside Cloudflare from its own env vars and
      # could race/overwrite a correct wrangler deploy landing around the
      # same time -- wrangler deploy is now the only deploy path.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Brookings)
        working-directory: site
        env:
          SITE_CITY: brookings_sd
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Brookings)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env brookings

name: closure-watch-morning
# Targeted early-morning refresh for /closures (Handoff: Information Hub
# Tier 1, Feature A) -- Brookings.
#
# The 6-hour scrape.yml cycle is right for the rest of the site (see that
# workflow's own comment), but it's wrong for THIS page specifically: the
# entire point of Closure Watch is being correct at the moment a parent
# actually checks it, which is early morning on a school day -- a closure
# announced at 5:45 AM has no business waiting for a cron boundary that
# might not land until noon. Rather than moving the whole site to a tighter
# cadence (the cost/aggressiveness tradeoff in scrape.yml's comment still
# applies to everything else), this is a narrow, cheap extra run: only the
# data source Closure Watch needs fresh (school_alerts via --only;
# NWS weather rows come from the cron-dispatcher Worker), the digest script, then a normal build+deploy
# of just this town. No ai_pipeline.publish (meetings/events/etc AI
# formatting) -- not needed for this page and not worth the AI spend on a
# second run per day.
#
# Schedule: weekdays only (closures only matter on school days), at a UTC
# time equal to 5:30 AM Central Daylight Time -- deliberately the DAYLIGHT
# offset, not standard, so the run lands at or BEFORE 5:30 AM local
# year-round (4:30 AM Central Standard Time in winter, which is early but
# harmless; the alternative -- picking the standard-time offset -- would run
# at 6:30 AM local in summer, too late to matter).

on:
  # No schedule: started by the Cloudflare cron Worker (workflow_dispatch, weekdays 10:30 UTC). GitHub cron ran 4-9 h late.
  workflow_dispatch: {}

jobs:
  closure-watch-morning:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:       ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:         "ViewMediaBot (+https://brookingsview.com/contact)"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      - name: Fingerprint before
        run: python -m scripts.ci_changed before brookings_sd --preset data
      # weather_alerts removed 2026-11-07: NWS rows in `events` are written
      # live by the cron-dispatcher Worker (alerts/store.ts) and by scrape.yml.
      - name: Refresh only school_alerts
        run: python -m scrapers.runner --config configs/brookings_sd.json --only school_alerts
      - name: Closure Watch (history + Watch-state prose)
        run: python -m ai_pipeline.closure_watch_digest --config configs/brookings_sd.json
      - name: Did the site content change?
        id: changed
        run: python -m scripts.ci_changed after brookings_sd --preset data
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
      - name: Install site deps
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        run: npm ci
      - name: Build (Brookings)
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        env:
          SITE_CITY: brookings_sd
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Missing here until 2026-09-09 -- this job's own wrangler deploy
          # below pushes straight to production on a weekday-morning
          # schedule sandwiched between the 6-hourly scrape.yml runs, so a
          # build without this key silently emptied /whats-on/ every
          # weekday morning (fetchTicketmasterEvents() returns [] on a
          # missing key rather than crashing) until the next scrape.yml run
          # overwrote it back -- the same short-lived-empty-page symptom as
          # the competing-deploy race (see NEEDS-HUMAN-REVIEW.md #38), just
          # on a different schedule and a different cause.
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Brookings)
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ../scripts/wrangler_deploy_retry.sh --env brookings
      # See deploy.yml's purge step for the full 2026-10-15 incident
      # writeup (.claude/state.md). This workflow has no deploy-content
      # check of its own to sequence after -- continue-on-error still
      # applies so a purge failure is visible without failing the whole
      # job over a step that runs last anyway.
      - name: Purge Cloudflare cache
        if: success() && steps.changed.outputs.changed == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID_BROOKINGS }}
        run: python -m scripts.purge_cloudflare_cache --town brookings_sd

name: broomfield-scrape-and-publish
# Broomfield-motsvarigheten till scrape.yml/moval-scrape.yml. Egen config,
# egen USER_AGENT, egen AI_BUDGET_STATE.
#
# Sänkt från varje timme till var 6:e timme 2026-08-28 -- se scrape.yml:s
# egen kommentar för hela resonemanget (gäller identiskt här).

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}       # tillåt manuell körning

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:       ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:         "broomfieldview.com (contact: hello@broomfieldview.com)"
      AI_BUDGET_STATE:    ".ai_budget_broomfield_co.json"
      CDOT_API_KEY:       ${{ secrets.CDOT_API_KEY }}
      ADZUNA_APP_ID:      ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY:     ${{ secrets.ADZUNA_APP_KEY }}
      ALERT_WEBHOOK:      ${{ secrets.ALERT_WEBHOOK }}
      ALERT_AFTER_FAILURES: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kör scrapers (skriver rådata till DB)
        run: python -m scrapers.runner --config configs/broomfield_co.json
      - name: Formatera och publicera stories (Stage 3 -> stories)
        run: python -m ai_pipeline.publish --config configs/broomfield_co.json
      # QA finding #1 (2026-10): denna var byggd och live-verifierad sedan
      # 2026-08-27 men aldrig kopplad in här -- körd exakt EN gång, manuellt,
      # 2026-10-14. Samma continue-on-error-resonemang som scrape.yml:s Phase
      # 7-steg (Brookings/Legistar): ett fel ska synas i Actions-loggen men
      # aldrig stoppa publicering/build/deploy nedan.
      - name: "Phase 7 (Decisions): uppdatera meeting_decisions från AgendaLink"
        continue-on-error: true
        run: python -m ai_pipeline.meeting_decisions_agendalink --config configs/broomfield_co.json
      # Phase 6 (City Hall Projects): se moval-scrape.yml:s identiska steg
      # för hela resonemanget (real-elapsed-time-gate inne i skriptet
      # självt, inte en timme-på-dygnet-koll här).
      - name: "Phase 6 (Projects): tröskla mötesutfall mot projektregistret"
        continue-on-error: true
        run: python -m ai_pipeline.project_updates --config configs/broomfield_co.json
      # Closure Watch -- see scrape.yml's identical step for the full
      # comment. Disabled in configs/broomfield_co.json (see that file's own
      # note), so this exits immediately here -- kept in the workflow so
      # enabling the feature later needs no workflow edit.
      - name: Closure Watch (history + Watch-state prose)
        run: python -m ai_pipeline.closure_watch_digest --config configs/broomfield_co.json
      # Marquee deck sentences -- see scrape.yml's identical step for the
      # full comment.
      - name: Marquee deck sentences (What's On)
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python -m ai_pipeline.event_deck_digest --config configs/broomfield_co.json
      # Image pool rotation -- see scrape.yml's identical step for the full
      # comment.
      - name: Image pool rotation (category images)
        run: python -m ai_pipeline.assign_category_image_rotation --config configs/broomfield_co.json
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Broomfield)
        working-directory: site
        env:
          SITE_CITY: broomfield_co
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # What's On: threaded through so getTicketmasterEventsForTown()
          # actually has a key to call with, now that hasWhatsOn/
          # ticketmaster.enabled are true for Broomfield (Phase 7 follow-up)
          # -- this was missing here even though scrape.yml (Brookings) has
          # had it since Phase 3, which is why production silently showed
          # zero events despite a green build (fetchTicketmasterEvents()
          # returns [] rather than crashing on a missing key -- see Part 4's
          # new build-log warning for making that failure mode visible).
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Broomfield)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env broomfield
      # See deploy.yml's purge step for the full 2026-10-15 incident
      # writeup (.claude/state.md). continue-on-error so a purge failure
      # is visible but never blocks the deploy-content check below.
      - name: Purge Cloudflare cache
        if: success()
        continue-on-error: true
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID_BROOMFIELD }}
        run: python -m scripts.purge_cloudflare_cache --town broomfield_co
      # DEPLOY: hook-steget borttaget (2026-09-09) -- se scrape.yml:s egen
      # kommentar (och NEEDS-HUMAN-REVIEW.md #38) för hela resonemanget.
      - name: Kontrollera att den deployade sajten faktiskt har färskt innehåll
        if: success()
        env:
          # Broomfield 403 fix: Cloudflare's bot-management blocks GitHub
          # Actions' own runner IPs regardless of User-Agent (see
          # scripts/check_deployed_content.py's own DEPLOY_CHECK_HEADER
          # comment) -- this shared secret, verified by a Cloudflare WAF
          # Custom Rule against the same header, is the bypass. Set for all
          # three towns' workflows even though only Broomfield's zone has a
          # matching rule yet, so a rule added later for another town needs
          # no workflow change.
          DEPLOY_CHECK_SECRET: ${{ secrets.DEPLOY_CHECK_SECRET }}
        run: |
          sleep 10
          python -m scripts.check_deployed_content --config configs/broomfield_co.json

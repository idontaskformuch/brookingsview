name: broomfield-scrape-and-publish
# Broomfield-motsvarigheten till scrape.yml/moval-scrape.yml. Egen config,
# egen USER_AGENT, egen AI_BUDGET_STATE. PAGES_DEPLOY_HOOK_BROOMFIELD är ett
# eget secret -- återanvänd ALDRIG Brookings/Moreno Valleys hook, då triggar
# det fel sajts bygge.

on:
  schedule:
    - cron: "0 * * * *"      # varje timme (justera per behov)
  workflow_dispatch: {}       # tillåt manuell körning

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:       ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:         "broomfieldview.com (contact: hello@broomfieldview.com)"
      AI_BUDGET_STATE:    ".ai_budget_broomfield_co.json"
      CDOT_API_KEY:       ${{ secrets.CDOT_API_KEY }}
      ALERT_WEBHOOK:      ${{ secrets.ALERT_WEBHOOK }}
      ALERT_AFTER_FAILURES: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kör scrapers (skriver rådata till DB)
        run: python -m scrapers.runner --config configs/broomfield_co.json
      - name: Formatera och publicera stories (Stage 3 -> stories)
        run: python -m ai_pipeline.publish --config configs/broomfield_co.json
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Broomfield)
        working-directory: site
        env:
          SITE_CITY: broomfield_co
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Broomfield)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env broomfield
      - name: Trigga Cloudflare Pages-rebuild
        if: success()
        run: |
          if [ -z "${{ secrets.PAGES_DEPLOY_HOOK_BROOMFIELD }}" ]; then
            echo "::error::PAGES_DEPLOY_HOOK_BROOMFIELD saknas — rebuild kan inte triggas"
            exit 1
          fi
          curl -fsSL -X POST "${{ secrets.PAGES_DEPLOY_HOOK_BROOMFIELD }}"

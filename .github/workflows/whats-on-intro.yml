name: whats-on-intro
# What's On Phase 6b -- the weekly editorial intro block above /whats-on's
# Marquee. Monday morning (matches weekly-roundup.yml's own reasoning: after
# the weekend's listings have settled, while the week is still ahead of the
# reader), plus a nightly re-check -- the generator hashes the week's actual
# event set (ai_pipeline/whats_on_intro.py's content_hash()), so a run where
# nothing changed makes no AI call at all.
#
# Inert everywhere today: features.whats_on.enabled and its nested
# ticketmaster.enabled are both false in every configs/<town_id>.json until
# Phase 7's town-by-town rollout (same convention as scrape.yml's own
# already-wired-but-inert TICKETMASTER_API_KEY threading). Brookings-only
# for now, same as the Ticketmaster source itself.

on:
  schedule:
    - cron: "0 11 * * 1"    # Monday morning
    - cron: "0 23 * * *"    # nightly -- only writes on an actual content change
  workflow_dispatch: {}

jobs:
  whats-on-intro:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:         ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generera veckans What's On-intro (Brookings)
        run: python -m ai_pipeline.whats_on_intro --config configs/brookings_sd.json
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK curl step (2026-09-09) --
      # see scrape.yml's own comment and NEEDS-HUMAN-REVIEW.md #38. The hook
      # built independently inside Cloudflare from its own env vars and
      # could race/overwrite a correct wrangler deploy landing around the
      # same time -- wrangler deploy is now the only deploy path. Doubly
      # relevant here: this workflow's whole purpose is a What's On/
      # Ticketmaster block, exactly the content that went missing.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Brookings)
        working-directory: site
        env:
          SITE_CITY: brookings_sd
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Brookings)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env brookings

name: moval-local-sports-digest
# Kör local_sports_weekly_digest.py -- se ai_pipeline/local_sports_weekly_digest.py
# för varför källan är skoldistriktets ALLMÄNNA meddelandeflöde (school_alerts)
# i stället för en dedikerad high school-sportkälla (ingen sådan verifierad
# öppen källa hittades, se NEEDS-HUMAN-REVIEW.md). Samma måndagscadence som
# moval-sports-digest.yml (den regionala 66ers/Angels/Dodgers-sammanfattningen)
# -- den här är ett komplement, inte en ersättning.

on:
  schedule:
    - cron: "15 15 * * 1"   # måndag 15:15 UTC -- efter moval-sports-digest, samma dag
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:        "morenovalleyview.com (contact: hello@morenovalleyview.com)"
      AI_BUDGET_STATE:   ".ai_budget_moreno_valley_ca.json"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generera veckans lokala skolsport-notis
        run: python -m ai_pipeline.local_sports_weekly_digest --config configs/moreno_valley_ca.json
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK_MOVAL curl step
      # (2026-09-09) -- see scrape.yml's own comment and
      # NEEDS-HUMAN-REVIEW.md #38. The hook built independently inside
      # Cloudflare from its own env vars and could race/overwrite a correct
      # wrangler deploy landing around the same time -- wrangler deploy is
      # now the only deploy path.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Moreno Valley)
        working-directory: site
        env:
          SITE_CITY: moreno_valley_ca
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Moreno Valley)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env moreno_valley

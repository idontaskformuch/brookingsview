name: moval-scrape-and-publish
# Moreno Valley-motsvarigheten till scrape.yml. Egen config, egen USER_AGENT,
# egen AI_BUDGET_STATE. PAGES_DEPLOY_HOOK_MOVAL är ett eget secret --
# återanvänd ALDRIG Brookings PAGES_DEPLOY_HOOK, då triggar det fel sajts bygge.
#
# Sänkt från varje timme till var 6:e timme 2026-08-28 -- se scrape.yml:s
# egen kommentar för hela resonemanget (gäller identiskt här).

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}       # tillåt manuell körning

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:       ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:         "morenovalleyview.com (contact: hello@morenovalleyview.com)"
      AI_BUDGET_STATE:    ".ai_budget_moreno_valley_ca.json"
      ADZUNA_APP_ID:      ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY:     ${{ secrets.ADZUNA_APP_KEY }}
      ALERT_WEBHOOK:      ${{ secrets.ALERT_WEBHOOK }}
      ALERT_AFTER_FAILURES: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kör scrapers (skriver rådata till DB)
        run: python -m scrapers.runner --config configs/moreno_valley_ca.json
      - name: Formatera och publicera stories (Stage 3 -> stories)
        run: python -m ai_pipeline.publish --config configs/moreno_valley_ca.json
      # Closure Watch -- see scrape.yml's identical step for the full comment.
      - name: Closure Watch (history + Watch-state prose)
        run: python -m ai_pipeline.closure_watch_digest --config configs/moreno_valley_ca.json
      # DEPLOY FIX (se NEEDS-HUMAN-REVIEW.md): PAGES_DEPLOY_HOOK_MOVAL nedan
      # pekar på ett övergivet Cloudflare Pages-projekt -- sajten deployas
      # numera via Cloudflare Workers (site/wrangler.jsonc), som den gamla
      # hooken aldrig når. Detta bygger och deployar via wrangler PARALLELLT
      # med den gamla hooken (som lämnas orörd tills det nya sättet är
      # bevisat live, se acceptanskriterierna) -- inte en ersättning än.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Moreno Valley)
        working-directory: site
        env:
          SITE_CITY: moreno_valley_ca
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Moreno Valley)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env moreno_valley
      - name: Trigga Cloudflare Pages-rebuild
        if: success()
        run: |
          if [ -z "${{ secrets.PAGES_DEPLOY_HOOK_MOVAL }}" ]; then
            echo "::error::PAGES_DEPLOY_HOOK_MOVAL saknas — rebuild kan inte triggas"
            exit 1
          fi
          curl -fsSL -X POST "${{ secrets.PAGES_DEPLOY_HOOK_MOVAL }}"
      # Se scrape.yml:s egen kommentar för hela resonemanget.
      - name: Kontrollera att den deployade sajten faktiskt har färskt innehåll
        if: success()
        run: |
          sleep 10
          python -m scripts.check_deployed_content --config configs/moreno_valley_ca.json

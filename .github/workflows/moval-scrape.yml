name: moval-scrape-and-publish
# Moreno Valley-motsvarigheten till scrape.yml. Egen config, egen USER_AGENT,
# egen AI_BUDGET_STATE.
#
# Sänkt från varje timme till var 6:e timme 2026-08-28 -- se scrape.yml:s
# egen kommentar för hela resonemanget (gäller identiskt här).

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}       # tillåt manuell körning

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:       ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:         "morenovalleyview.com (contact: hello@morenovalleyview.com)"
      AI_BUDGET_STATE:    ".ai_budget_moreno_valley_ca.json"
      ADZUNA_APP_ID:      ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY:     ${{ secrets.ADZUNA_APP_KEY }}
      ALERT_WEBHOOK:      ${{ secrets.ALERT_WEBHOOK }}
      ALERT_AFTER_FAILURES: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kör scrapers (skriver rådata till DB)
        run: python -m scrapers.runner --config configs/moreno_valley_ca.json
      - name: Formatera och publicera stories (Stage 3 -> stories)
        run: python -m ai_pipeline.publish --config configs/moreno_valley_ca.json
      # Closure Watch -- see scrape.yml's identical step for the full comment.
      - name: Closure Watch (history + Watch-state prose)
        run: python -m ai_pipeline.closure_watch_digest --config configs/moreno_valley_ca.json
      # Marquee deck sentences -- see scrape.yml's identical step for the
      # full comment.
      - name: Marquee deck sentences (What's On)
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python -m ai_pipeline.event_deck_digest --config configs/moreno_valley_ca.json
      # Image pool rotation -- see scrape.yml's identical step for the full
      # comment.
      - name: Image pool rotation (category images)
        run: python -m ai_pipeline.assign_category_image_rotation --config configs/moreno_valley_ca.json
      # DEPLOY: se scrape.yml:s egen kommentar (och NEEDS-HUMAN-REVIEW.md
      # #38) för hela resonemanget -- wrangler deploy nedan är nu den ENDA
      # deploy-vägen, hook-steget är borttaget (2026-09-09), inte längre
      # parallellt.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Moreno Valley)
        working-directory: site
        env:
          SITE_CITY: moreno_valley_ca
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # What's On: threaded through so getTicketmasterEventsForTown()
          # actually has a key to call with, now that hasWhatsOn/
          # ticketmaster.enabled are true for Moreno Valley (Phase 7
          # follow-up) -- this was missing here even though scrape.yml
          # (Brookings) has had it since Phase 3, which is why production
          # silently showed zero events despite a green build
          # (fetchTicketmasterEvents() returns [] rather than crashing on a
          # missing key -- see Part 4's new build-log warning for making
          # that failure mode visible).
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Moreno Valley)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env moreno_valley
      # Se scrape.yml:s egen kommentar för hela resonemanget.
      - name: Kontrollera att den deployade sajten faktiskt har färskt innehåll
        if: success()
        env:
          # Broomfield 403 fix: see broomfield-scrape.yml's identical
          # comment. Set here too even though Moreno Valley's zone has no
          # matching Cloudflare rule yet -- harmless (the header is simply
          # unused) and means a rule added later here needs no workflow
          # change.
          DEPLOY_CHECK_SECRET: ${{ secrets.DEPLOY_CHECK_SECRET }}
        run: |
          sleep 10
          python -m scripts.check_deployed_content --config configs/moreno_valley_ca.json

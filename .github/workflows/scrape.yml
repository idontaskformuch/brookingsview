name: scrape-and-publish
# Kör scrapers + AI-formatering schemalagt, pinga sen Cloudflare Pages deploy hook
# så Astro bygger om med färsk data. Händelsestyrt underhåll via alerting i runner.py.
#
# Sänkt från varje timme till var 6:e timme 2026-08-28: kostnad var aldrig
# skälet (Actions är gratis för publika repon), men timvis skrapning av
# kommunala sajter är onödigt aggressivt och riskerar att bli blockerat --
# ingen av källorna publicerar/uppdaterar sig snabbt nog för att motivera
# timvis ändå (möten/permits/löner ändras inte inom en timme). traffic_incidents
# är det enda genuint tidskänsliga flödet (egen refresh_minutes=20-spärr i
# configen sedan tidigare) -- men eftersom sajten är statisk gör en tätare
# DB-skrapning ingenting för läsaren utan en lika tät ombyggnad/redeploy, så
# att bryta ut den separat är en STÖRRE ändring (egen build+deploy-pipeline,
# inte bara ett extra scrape-jobb) än vad som görs här -- flaggat, inte byggt.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}       # tillåt manuell körning

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:       ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
      NASS_API_KEY:       ${{ secrets.NASS_API_KEY }}
      ADZUNA_APP_ID:      ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY:     ${{ secrets.ADZUNA_APP_KEY }}
      USER_AGENT:         "brookingsview.com (contact: hello@brookingsview.com)"
      ALERT_WEBHOOK:      ${{ secrets.ALERT_WEBHOOK }}
      ALERT_AFTER_FAILURES: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kör scrapers (skriver rådata till DB)
        run: python -m scrapers.runner --config configs/brookings_sd.json
      - name: Formatera och publicera stories (Stage 3 -> stories)
        run: python -m ai_pipeline.publish --config configs/brookings_sd.json
      # Closure Watch (Handoff: Information Hub Tier 1, Feature A): records
      # confirmed-closure history and, only when the town is in the Watch
      # state, tries a guardrailed AI paragraph. Piggybacks this existing
      # 6-hour cycle rather than its own hourly cron -- see that workflow's
      # own comment above for why hourly scraping was deliberately dropped,
      # and Handoff §8 ("known risks") for why a new hourly job wasn't added
      # here either. No-ops instantly if features.closure_watch is disabled.
      - name: Closure Watch (history + Watch-state prose)
        run: python -m ai_pipeline.closure_watch_digest --config configs/brookings_sd.json
      # Marquee deck sentences follow-up: the one-sentence "deck" under a
      # marquee-tier Ticketmaster event's hero card, cached per event id --
      # see that script's own module docstring. Runs before the build below
      # so a freshly-generated deck is available to it same-run. No-ops
      # instantly if features.whats_on(.ticketmaster) is disabled.
      - name: Marquee deck sentences (What's On)
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python -m ai_pipeline.event_deck_digest --config configs/brookings_sd.json
      # Image pool rotation (Addendum 2): assigns any story published since
      # the last run a durable, round-robin slot in its category's image
      # pool (site/src/lib/images.ts's resolveImage() reads it at build
      # time below) -- see that script's own module docstring for why this
      # scans broadly for "any story missing a slot" rather than being
      # wired into every individual publish/digest step that can insert a
      # story (eleven separate files, no single chokepoint). Runs before
      # the build so a freshly-assigned slot is live same-run.
      - name: Image pool rotation (category images)
        run: python -m ai_pipeline.assign_category_image_rotation --config configs/brookings_sd.json
      # DEPLOY (se NEEDS-HUMAN-REVIEW.md #21 och #38): wrangler deploy nedan
      # är den ENDA deploy-MEKANISMEN -- men inte den enda TRIGGERN längre,
      # se deploy.yml. #21:s ursprungliga antagande -- att PAGES_DEPLOY_HOOK
      # pekade på ett övergivet Pages-projekt som wrangler aldrig når --
      # visade sig vara FEL: Cloudflare-dashboardens Deployments-historik
      # (2026-09-08/09) visade hook-triggade bygglogg landa i SAMMA
      # produktionshistorik som wrangler-deployen, byggda oberoende inuti
      # Cloudflare från vilka env-variabler som än var satta DÄR (inte de
      # här GitHub Actions-secreten), och som ibland vann racet mot
      # wrangler-deployen -- grundorsaken till att What's On tidvis visade
      # sig tomt trots ett grönt, korrekt bygge. Hook-steget togs därför
      # bort (inte bara lämnat parallellt) -- men SAMMA felklass återkom en
      # tredje gång 2026-09-09 som Cloudflare Workers Builds (en separat,
      # dashboard-konfigurerad git-integration, inte styrd av den här YAML-
      # filen alls), byggandes med sin egen, ofullständiga hemlighetsuppsätt-
      # ning (saknade TICKETMASTER_API_KEY). Löst genom att stänga av Workers
      # Builds helt i Cloudflares dashboard -- inte genom att lägga till
      # nyckeln där, vilket bara hade lämnat kvar konstruktionen med två
      # oberoende vägar in i produktion för nästa variant av samma bugg.
      # deploy.yml/moval-deploy.yml/broomfield-deploy.yml lades till SAMTIDIGT
      # (samma commit) som en andra TRIGGER för exakt samma wrangler-deploy
      # nedan, så en ren kodpush fortfarande går live inom minuter i stället
      # för att vänta på nästa 6-timmars scrape-cron.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Brookings)
        working-directory: site
        env:
          SITE_CITY: brookings_sd
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # What's On Phase 3: threaded through now even though nothing
          # calls it yet (siteConfig.ticketmaster.enabled is false) -- see
          # lib/ticketmaster.ts's own module comment. Harmless either way:
          # fetchTicketmasterEvents() itself never crashes a build on a
          # missing/invalid key.
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Brookings)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env brookings
      # Kontrollerar den RIKTIGA, deployade sajten -- inte bara att bygget
      # gick igenom grönt. Se scripts/check_deployed_content.py:s egen
      # moduldocstring: en grön build maskerade tyst både run_worker_first-
      # buggen och en flerdagars innehålls-pipeline-utslagning innan detta
      # fanns, eftersom "inget nytt den här körningen" och "pipelinen är
      # död" ger identisk exitkod. Kort paus innan anropet för att ge
      # Cloudflares kant en stund att bli klar med propagering.
      - name: Kontrollera att den deployade sajten faktiskt har färskt innehåll
        if: success()
        env:
          # Broomfield 403 fix: see broomfield-scrape.yml's identical
          # comment. Set here too even though Brookings' zone has no
          # matching Cloudflare rule yet -- harmless (the header is simply
          # unused) and means a rule added later here needs no workflow
          # change.
          DEPLOY_CHECK_SECRET: ${{ secrets.DEPLOY_CHECK_SECRET }}
        run: |
          sleep 10
          python -m scripts.check_deployed_content --config configs/brookings_sd.json

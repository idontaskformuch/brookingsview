name: moval-daily-content
# Moreno Valley-motsvarigheten till daily-content.yml. Samma pipeline, egen
# config + egen USER_AGENT (identitetshygien, se MORENO_VALLEY_SETUP.md) +
# egen AI_BUDGET_STATE-fil så budgettaket inte delas med Brookings-körningen.

on:
  schedule:
    - cron: "0 14 * * *"   # varje morgon, 14:00 UTC (07:00 PDT) -- Moreno Valley ligger i Pacific, inte Central
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-content:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FAL_KEY:           ${{ secrets.FAL_KEY }}
      USER_AGENT:        "morenovalleyview.com (contact: hello@morenovalleyview.com)"
      AI_BUDGET_STATE:   ".ai_budget_moreno_valley_ca.json"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generera dagens innehåll + illustration
        run: python -m ai_pipeline.daily_content --config configs/moreno_valley_ca.json
      - name: Committa genererad illustration
        run: |
          git config user.name "morenovalleyview-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/assets/images
          if git diff --cached --quiet; then
            echo "ingen ny illustration -- inget att committa"
          else
            git commit -m "Daily content (Moreno Valley): add illustration for today's article"
            git pull --rebase origin main && git push
          fi
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK_MOVAL curl step
      # (2026-09-09) -- see scrape.yml's own comment and
      # NEEDS-HUMAN-REVIEW.md #38. The hook built independently inside
      # Cloudflare from its own env vars and could race/overwrite a correct
      # wrangler deploy landing around the same time -- wrangler deploy is
      # now the only deploy path. Builds from THIS job's own local
      # checkout, which already has the illustration committed above (git
      # add/commit operate on local disk before the push) -- no extra
      # checkout/pull needed.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Moreno Valley)
        working-directory: site
        env:
          SITE_CITY: moreno_valley_ca
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Moreno Valley)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env moreno_valley

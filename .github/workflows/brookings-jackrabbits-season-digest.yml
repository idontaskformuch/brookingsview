name: brookings-jackrabbits-season-digest
# PENSIONERAD 2026-11-08 (ägaren): ingen schemakörning, /jackrabbits visar ingen säsongssammanfattning längre. Bara workflow_dispatch.
# Kör jackrabbits_season_digest.py: ETT standing "season so far"-sammandrag
# per sport i sports_games (SDSU Jackrabbits, se scrapers/parsers/gojacks_v1.py),
# uppdaterat i samma slug i stället för en ny story per körning -- se den
# modulens docstring för varför detta INTE är samma mönster som
# sports_weekly_digest.py/sdsu_weekly_digest.py (som ackumulerar en story per
# vecka). Körs efter sdsu_athletics-skrapningen (var 3:e timme, se
# configs/brookings_sd.json) hunnit plocka upp senaste resultaten -- en gång
# om dagen räcker, content_hash-kollen i skriptet skippar AI-anropet om
# underlaget (vilka matcher som spelats) inte ändrats.

on:
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:        "ViewMediaBot (+https://brookingsview.com/contact)"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      - name: Fingerprint before
        run: python -m scripts.ci_changed before brookings_sd --preset content
      - name: Generera Jackrabbits säsongssammanfattningar
        run: python -m ai_pipeline.jackrabbits_season_digest --config configs/brookings_sd.json
      - name: Did the site content change?
        id: changed
        run: python -m scripts.ci_changed after brookings_sd --preset content
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK curl step (2026-09-09) --
      # see scrape.yml's own comment and NEEDS-HUMAN-REVIEW.md #38. The hook
      # built independently inside Cloudflare from its own env vars and
      # could race/overwrite a correct wrangler deploy landing around the
      # same time -- wrangler deploy is now the only deploy path.
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
      - name: Install site deps
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        run: npm ci
      - name: Build (Brookings)
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        env:
          SITE_CITY: brookings_sd
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Brookings)
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ../scripts/wrangler_deploy_retry.sh --env brookings

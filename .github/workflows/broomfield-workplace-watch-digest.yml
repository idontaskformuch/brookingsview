name: broomfield-workplace-watch-digest
# Broomfield-motsvarigheten till moval-workplace-watch-digest.yml. Kör
# scripts.seed_employers (säkert att köra om -- upsertar på (town_id, slug))
# följt av ai_pipeline.workplace_watch_digest, som söker (Brave Search --
# Glassdoor/Indeed har ingen publik API och blockerar skrapning) och skriver
# månadens Worker Pulse-digest per arbetsgivare (Vail Resorts, Ball
# Corporation, Noodles & Company -- se data/employers/broomfield_co.json).
# Månatlig cadence, samma resonemang som Moreno Valleys egen fil: review-
# volym ändras inte snabbt nog för att motivera oftare körningar.

on:
  schedule:
    - cron: "0 14 1 * *"   # 1:a varje månad, 14:00 UTC (07:00-08:00 Mountain beroende på DST)
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRAVE_API_KEY:     ${{ secrets.BRAVE_API_KEY }}
      USER_AGENT:        "broomfieldview.com (contact: hello@broomfieldview.com)"
      AI_BUDGET_STATE:   ".ai_budget_broomfield_co.json"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Uppdatera arbetsgivarlistan
        run: python -m scripts.seed_employers broomfield_co
      - name: Generera månadens Worker Pulse-digest
        run: python -m ai_pipeline.workplace_watch_digest --config configs/broomfield_co.json
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK_BROOMFIELD curl step
      # (2026-09-09) -- see scrape.yml's own comment and
      # NEEDS-HUMAN-REVIEW.md #38. The hook built independently inside
      # Cloudflare from its own env vars and could race/overwrite a correct
      # wrangler deploy landing around the same time -- wrangler deploy is
      # now the only deploy path.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Broomfield)
        working-directory: site
        env:
          SITE_CITY: broomfield_co
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Broomfield)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env broomfield

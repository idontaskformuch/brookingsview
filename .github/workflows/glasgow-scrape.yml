name: glasgow-scrape
# Glasgow: insamling -> publicering -> bygge -> deploy -> kontroll av den live
# sajten, i samma takt som US-städerna (scrape.yml). Startas av cron-dispatchern
# (workflow_dispatch, var 6:e timme); källor med refresh_minutes (city_meetings
# = 1440) hoppas över av runnern om de körts nyligen.
# Publiceringen går genom samma ai_pipeline.publish som övriga städer, och
# UK-spärrarna (uk_guardrails + UK-grinden i guardrails.validate, loggen
# reports/uk_gate_log.jsonl) gäller där -- tests/test_uk_gate_coverage.py faller
# om en generator kringgår dem. Sajten är fortfarande noindex tills ägaren sagt
# ja (lanseringschecklistan i .claude/state.md). Ingen cache-purge: Glasgow har
# zon-secret förrän ägaren lagt in CLOUDFLARE_ZONE_ID_GLASGOW (purge-steget nedan
# är continue-on-error och rapporterar tydligt om secret eller behörighet saknas).

on:
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MET_OFFICE_WARNINGS_API_KEY: ${{ secrets.MET_OFFICE_WARNINGS_API_KEY }}
      MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
      SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:   "ViewMediaBot (+https://glasgowloop.co.uk/contact)"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      - name: Fingerprint before
        run: python -m scripts.ci_changed before glasgow --preset data
      - name: Kör scrapers (skriver rådata till DB)
        run: python -m scrapers.runner --config configs/glasgow.json
      - name: Formatera och publicera stories (Stage 3 -> stories, UK-spärrar)
        run: python -m ai_pipeline.publish --config configs/glasgow.json
      - name: Image pool rotation (category images)
        run: python -m ai_pipeline.assign_category_image_rotation --config configs/glasgow.json
      - name: Did the site content change?
        id: changed
        run: python -m scripts.ci_changed after glasgow --preset data
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
      - name: Install site deps
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        run: npm ci
      - name: Build (Glasgow)
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        env:
          SITE_CITY: glasgow
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # What's On (Ticketmaster GB, 15 mi) is fetched at build time; without the key the page would be empty (the Moreno 2026-09 bug).
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Glasgow)
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash ../scripts/wrangler_deploy_retry.sh --env glasgow
      # Se deploy.yml:s purge-steg (2026-10-15-incidenten): Workers Static Assets
      # cachar HTML vid kanten utan automatisk invalidering. continue-on-error så
      # att ett purge-fel syns men inte stoppar live-kontrollen nedan.
      - name: Purge Cloudflare cache
        if: success() && steps.changed.outputs.changed == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID_GLASGOW }}
        run: python -m scripts.purge_cloudflare_cache --town glasgow
      # Kontrollerar den RIKTIGA sajten: prognosen visar idag + imorgon i degC och
      # inga passerade event ligger kvar i listorna (se scripts/check_glasgow_live.py).
      - name: Kontrollera den deployade Glasgow-sajten
        if: success() && steps.changed.outputs.changed == 'true'
        run: |
          sleep 15
          python -m scripts.check_glasgow_live

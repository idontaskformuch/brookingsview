name: moval-sports-digest
# Kör sports_weekly_digest.py, som sammanfattar den senast AVSLUTADE
# måndag-söndag-veckan i regional_sports_games (66ers/Angels/Dodgers, se
# scrapers/parsers/regional_sports_v1.py). Till skillnad från
# moval-weekly-roundup.yml (som täcker en vecka som fortfarande pågår och
# därför kör om varje kväll) är förra veckans matcher redan slutgiltiga när
# det här körs -- en enda måndagskörning räcker. content_hash-kollen i
# skriptet skippar ändå AI-anropet om något manuellt kört om samma vecka.

on:
  schedule:
    - cron: "0 15 * * 1"   # måndag 15:00 UTC (08:00 PDT) -- efter helgens matcher
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      USER_AGENT:        "morenovalleyview.com (contact: hello@morenovalleyview.com)"
      AI_BUDGET_STATE:   ".ai_budget_moreno_valley_ca.json"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generera veckans sportsammanfattning
        run: python -m ai_pipeline.sports_weekly_digest --config configs/moreno_valley_ca.json
      # DEPLOY: replaces the old PAGES_DEPLOY_HOOK_MOVAL curl step
      # (2026-09-09) -- see scrape.yml's own comment and
      # NEEDS-HUMAN-REVIEW.md #38. The hook built independently inside
      # Cloudflare from its own env vars and could race/overwrite a correct
      # wrangler deploy landing around the same time -- wrangler deploy is
      # now the only deploy path.
      - uses: actions/setup-node@v4
      - name: Install site deps
        working-directory: site
        run: npm ci
      - name: Build (Moreno Valley)
        working-directory: site
        env:
          SITE_CITY: moreno_valley_ca
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx astro build
      - name: Deploy to Cloudflare Workers (Moreno Valley)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env moreno_valley

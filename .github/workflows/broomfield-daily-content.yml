name: broomfield-daily-content
# Broomfield-motsvarigheten till daily-content.yml/moval-daily-content.yml.
# Samma pipeline, egen config + egen USER_AGENT + egen AI_BUDGET_STATE-fil
# så budgettaket inte delas med de andra städernas körningar.

on:
  schedule:
    - cron: "0 13 * * *"   # varje morgon, 13:00 UTC (07:00 MDT) -- Broomfield ligger i Mountain, inte Central/Pacific
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  daily-content:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FAL_KEY:           ${{ secrets.FAL_KEY }}
      USER_AGENT:        "broomfieldview.com (contact: hello@broomfieldview.com)"
      AI_BUDGET_STATE:   ".ai_budget_broomfield_co.json"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generera dagens innehåll + illustration
        run: python -m ai_pipeline.daily_content --config configs/broomfield_co.json
      - name: Committa genererad illustration
        run: |
          git config user.name "broomfieldview-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/public/assets/images
          if git diff --cached --quiet; then
            echo "ingen ny illustration -- inget att committa"
          else
            git commit -m "Daily content (Broomfield): add illustration for today's article"
            git pull --rebase origin main && git push
          fi
      - name: Trigga Cloudflare Pages-rebuild
        if: success()
        run: |
          if [ -n "${{ secrets.PAGES_DEPLOY_HOOK_BROOMFIELD }}" ]; then
            curl -fsSL -X POST "${{ secrets.PAGES_DEPLOY_HOOK_BROOMFIELD }}"
          else
            echo "PAGES_DEPLOY_HOOK_BROOMFIELD ej satt -- hoppar över rebuild"
          fi
